# Verified league history — the authority for all outcome-linked analysis.
#
# The platform caches CANNOT be trusted for champions. From 2014 the league ran
# a dual-points regular season (1 pt for the matchup win + 1 pt for a weekly
# top-5 score) that ESPN could not represent, and since 2023 the regular-season
# winner picks its first-round opponent. ESPN's recorded "champion" is wrong for
# at least 2012, 2017, and 2020.
#
# `scoring` reflects the system actually in force: 2010-2013 were plain
# head-to-head. The dual-points rule was proposed 2013-11-18 and first played in
# 2014 week 1 — do not apply it to earlier seasons.
#
# Names are canonical (src/config.py MANAGER_ALIASES). Note that the manager
# exported by ESPN as "Donnie Darco" is Peter Wallach.
#
# source:
#   email        - a league email explicitly names the champion (strongest)
#   email_list   - a commissioner's retrospective list of past winners
#   derived      - forced by published cumulative title counts (see notes)
#   bracket      - resolved from the Sleeper playoff bracket
#
# Set `verified: true` once James confirms a season from memory; verified
# seasons are never overwritten by `python -m scripts.rebuild_standings --write`.
#
# NOTE: a separate "Gaetz Dynasty" league (Sleeper) also runs from 2024. Its
# winners were Anthony Lettieri (2024) and Brian Dzuris (2025). Those are NOT
# this league and must never be mixed into this file.

league: Chase for the Gaetz (CFTG) redraft

seasons:
  2010:
    champion: Donnie Darco          # Peter Wallach
    runner_up: null
    scoring: h2h
    source: email_list
    verified: false
    notes: "Commissioner's all-time winners list, 2014-12-22: '2010: Peter'."

  2011:
