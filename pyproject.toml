[project]
name = "ffb-analytics"
version = "0.1.0"
description = "Fantasy Football cross-platform analytics dashboard"
requires-python = ">=3.10"
dependencies = [
    "espn-api>=0.38.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    # src.league_data reads config/history.yaml and data/warehouse/*.parquet,
    # so the dashboard now needs both at import time.
    "PyYAML>=6.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
dashboard = "src.dashboard:main"
