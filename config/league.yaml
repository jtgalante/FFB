# League configuration for the draft engine.
#
# VERIFIED against the live Sleeper league on 2026-08-07:
#   CFTG, league_id 1388192476728147968, season 2026, status pre_draft.
#   Raw settings snapshot: data/draft/league_settings.json
#   Re-check with: python -m scripts.sleeper_settings --league-id 1388192476728147968
#
# Confirmed by that read: 6-point passing TDs, half-PPR, -2 interceptions,
# NO IR slot (0 IR, 0 taxi), 7 bench spots, 4-team playoff field.

teams: 10
my_draft_slot: 1          # James holds pick 1.1 in 2026
rounds: 15                # 8 starters + 7 bench; no IR/taxi slots to draft into

starters:
  QB: 1
  RB: 2
  WR: 2
  TE: 1
  FLEX: 2                 # RB/WR/TE eligible
                          # no K, no DST

flex_eligible: [RB, WR, TE]

bench_slots: 7
ir_slots: 0               # CONFIRMED: no IR spot. An injured player occupies a
                          # roster spot all season, so availability is costly.

regular_season_weeks: 14

# Regular season scoring is NOT plain head-to-head. Each week awards two
# points: one for winning your matchup, one for finishing in the week's top
# five scorers. Records read out of 2 x weeks (e.g. 18-10 of 28).
# Reconstructed and validated in scripts/rebuild_standings.py.
standings_system: dual_points
top_n_bonus: 5

# Playoffs: 4 teams. Week 15 is a single-week semifinal; weeks 16-17 are a
# TWO-WEEK aggregate final (combined score decides the title). The #1 seed
# chooses which of the other three qualifiers it plays in the semifinal
# (rule passed February 2023).
# Sleeper cannot express either the two-week final or the seed's opponent
# pick, so these two lines stay hand-maintained.
playoff_weeks: [15, 16, 17]
playoff_teams: 4
playoff_byes: 0
semifinal_weeks: [15]
final_weeks: [16, 17]
top_seed_picks_opponent: true

# Weekly team-score distribution for a league opponent, estimated from
# 2024-2025 matchups in data/sleeper_cache.json (regular season only).
opponent_weekly_mean: 100.7
opponent_weekly_sd: 20.8

# All values below read from Sleeper 2026-08-07. Kicker and DST scoring
# values exist in Sleeper's raw settings but are dead — there are no K or DST
# roster slots — so they are deliberately not mirrored here.
scoring:
  rec: 0.5                # half-PPR (passed 6-1 in the 2016 rules vote)
  pass_yd: 0.04
  # 6, not 4: the February 2023 proposal "Go back to four point passing TDs"
  # FAILED (1 vote for, 8 against). NOW CONFIRMED live: Sleeper pass_td = 6.
  pass_td: 6.0
  pass_int: -2.0          # was assumed -1; Sleeper says -2
  rush_yd: 0.1
  rush_td: 6.0
  rec_yd: 0.1
  rec_td: 6.0
  fum_lost: -2.0
  two_pt: 2.0             # passing 2pt
  two_pt_rush: 2.0
  two_pt_rec: 2.0

# --- Engine parameters (Section 7 of the spec) ---

# Both weights are DERIVED FROM research/variance_study.md rather than assumed.
#
# lambda_risk is the penalty on weekly inconsistency (utility = mean - lambda *
# sd). The spec set it to +0.5, i.e. "give up half a point of expected scoring
# to remove one point of weekly swing." The study measured that exchange rate
# and it points the other way, faintly:
#
#     1 pt/week of expected scoring   -> +1.72 pp of championship probability
#     sigma 12 -> 32 (20 units of sd) -> +0.59 pp  (+/- 0.17)
#
#     per unit of sd  = 0.59 / 20      = 0.0295 pp
#     in mean-equivalent = 0.0295/1.72 = 0.0172 pts/week
#     => lambda_risk = -0.0172
#
# Negative because variance is very slightly HELPFUL for title odds: it costs
# you seeding (dual points fall 14.25 -> 14.13 as sigma rises, and the top-5
# bonus is a threshold, so ceiling weeks are capped while floor weeks still
# cost) but buys a little in the bracket. Those nearly cancel.
#
# At this magnitude it is decision-irrelevant: two players with equal means and
# sigma 10 apart differ by 0.17 pts/week, about 2.4 points across a season. It
# is set to the measured value anyway, so that nobody reintroduces a large
# positive penalty without new evidence.
lambda_risk: -0.017

# Zero, and this one is a harder zero than lambda. The study finds NO support
# for tilting toward high-variance players late; the effect it measured is
# about weekly variance at a fixed mean, and it is ~nil. The usual argument for
# late upside is different — the waiver wire truncates the downside, so a bust
# is cheap — and that argument is WEAKER here than in most leagues because
# there is no IR slot, so a dud occupies one of only seven bench spots all
# season. If a late-round upside tilt is ever wanted, it needs its own
# parameter, its own justification, and its own test.
ceiling_weight: 0.0
#
# CAUTION for whoever revisits this: variance_study.md measures WEEKLY variance
# at a fixed season mean. It says nothing about season-long outcome uncertainty
# — the breakout-or-bust rookie whose true talent is unknown. A late-round
# upside tilt may still be justified, but by the waiver-wire-option argument
# (the downside is truncated because you can cut the bust), NOT by the
# top-heavy-payoff reasoning the study rejects. If that tilt is wanted, add it
# as a separate parameter with its own justification and its own test. Note
# also that this league has NO IR SLOT, so the carrying cost of a dud is a real
# roster spot all season — which weakens that option argument here.

# Per-player ADP dispersion is now measured (data/draft/adp.parquet carries
# adp_sd from 1808 drafts), and it ranges from 2.0 in rounds 1-2 to 15.7 in
# round 13+. A single global sigma is therefore wrong at both ends; this value
# survives only as a fallback for players the market does not price.
opponent_adp_noise: 4.0

n_draft_sims: 200             # forward draft sims per candidate
n_season_sims: 1000           # season Monte Carlo sims for full evaluation
n_season_sims_fast: 60        # season sims used inside the draft-sim loop
replacement_baseline_method: derived_flex   # see data.replacement_levels()
